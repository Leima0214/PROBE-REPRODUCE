seed: 42
device: cuda

backbone:
  name: vit_base_patch16_224
  embed_dim: 768
  frozen: true

spem:
  pca_dim: 50
  num_prototypes: 10
  kmeans_iters: 25
  prompt_hidden_dim: 256
  injection_layers: [0, 6]
  prompt_temperature: 0.2
  prompt_weight: 1.0

dapa:
  projection_dim: 256
  weight: 0.5

ssl:
  hidden_dim: 2048
  out_dim: 2048

detection:
  num_classes: 5
  hidden_dim: 384
  neck_dim: 128
  source_label_fraction: 1.0   # 1.0 = all labels; 0.1 = paper's limited-label setting

detection_optim:
  lr: 0.0001
  lr_min: 0.000001
  weight_decay: 0.0001
  epochs: 50
  focal_alpha: 0.25
  focal_gamma: 2.0
  box_weight: 1.0
  ctr_weight: 1.0
  score_threshold: 0.01
  nms_threshold: 0.5
  val_interval: 5

optim:
  lr: 0.0005
  weight_decay: 0.05
  pretrain_epochs: 100

data:
  source_manifest: data/Japan_labeled.jsonl       # Japan → Czech (paper: RDD-Japan → CRDDC'22)
  target_manifest: data/Czech_unlabeled.jsonl     # target unlabeled for SPEM + SSL
  val_manifest: data/japan_val.jsonl              # Czech validation set for mAP eval
  image_root: data/images
  batch_size: 32               # per-GPU batch (RTX 4070 Ti 12GB safe limit)
  gradient_accumulation: 1    # effective batch = 8 × 4 = 32
  num_workers: 2              # Windows-friendly default

moco:
  enabled: false              # set true to use MoCo prompt consistency
  queue_size: 4096            # negative-sample queue capacity
  temperature: 0.2            # InfoNCE temperature
  momentum: 0.999             # EMA coefficient for momentum projector
